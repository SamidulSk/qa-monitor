<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090B" />
    <meta name="description" content="ARC Document Solutions — QA script monitoring dashboard" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      /* Apply saved theme before first paint to avoid a flash (same "arc-theme" key as before) */
      try { if (localStorage.getItem("arc-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
    </script>
    <title>ARC Document Solutions</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
